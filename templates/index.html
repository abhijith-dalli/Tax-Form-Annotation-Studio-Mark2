<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tax Form Annotation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .form-info {
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        .value {
            font-weight: bold;
        }

        .position {
            font-family: monospace;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Tax Form Annotation Preview</h1>

    <div class="form-info">
        <p>
            <strong>Form:</strong>
            <span id="form-name">Loading...</span>
        </p>

        <p>
            <strong>Version:</strong>
            <span id="form-version">Loading...</span>
        </p>
    </div>

    <button onclick="generatePdf()">
        Generate PDF
    </button>

    <table>

        <thead>
            <tr>
                <th>Field</th>
                <th>Value</th>
                <th>Position</th>
            </tr>
        </thead>

        <tbody id="fields-table">
            <tr>
                <td colspan="3">Loading...</td>
            </tr>
        </tbody>

    </table>

</div>


<script>

    async function loadFormPreview() {

        const response = await fetch("/forms/1040/preview");

        const data = await response.json();

        document.getElementById("form-name").textContent =
            data.form.name;

        document.getElementById("form-version").textContent =
            data.form.version;

        const tableBody =
            document.getElementById("fields-table");

        tableBody.innerHTML = "";
        console.log(data);
        data.fields.forEach(field => {

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>
                    <strong>${field.label}</strong>
                    <br>
                    <small>${field.id}</small>
                </td>

                <td class="value">
                    ${field.value}
                </td>

                <td class="position">
                    Page ${field.position.page}<br>
                    X: ${field.position.x}<br>
                    Y: ${field.position.y}<br>
                    Width: ${field.position.width}<br>
                    Height: ${field.position.height}
                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    function generatePdf() {
        window.location.href = "/forms/1040/generate";
    }

    loadFormPreview();

</script>

</body>
</html>
