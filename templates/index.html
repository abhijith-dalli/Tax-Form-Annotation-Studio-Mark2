<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Form Annotation Studio</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="app-container">

    <div class="toolbar">
        <div class="toolbar-title">Tax Form Annotation Studio</div>
        <div class="toolbar-actions">
            <button class="toolbar-btn" id="btn-upload">Upload PDF</button>
            <span style="font-size:12px; color:#888; margin:0 8px;">
                <span id="form-name"></span> v<span id="form-version"></span>
            </span>
            <button class="toolbar-btn" id="btn-validate">Validate</button>
            <button class="toolbar-btn" id="btn-export">Export JSON</button>
            <button class="toolbar-btn primary" id="btn-generate">Generate PDF</button>
        </div>
    </div>

    <div class="main-content">

        <div class="fields-panel">
            <div class="panel-header">
                Fields
                <button id="btn-add-field">+ Add</button>
            </div>
            <div class="fields-list" id="fields-list">
                <div class="no-fields-message">No fields yet.<br>Upload a PDF to begin.</div>
            </div>
        </div>

        <div class="pdf-viewer-container">
            <div class="pdf-canvas-wrapper" id="pdf-canvas-wrapper">
                <div id="pdf-placeholder" style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; color:#666;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:16px;">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    <div style="font-size:14px; margin-bottom:6px;">No PDF loaded</div>
                    <div style="font-size:12px; margin-bottom:16px;">Upload a tax form PDF to start annotating</div>
                    <button class="toolbar-btn primary" onclick="app.showUploadModal()">Upload PDF</button>
                </div>
                <div class="pdf-canvas-container" id="pdf-canvas-container">
                    <div id="annotation-overlay"></div>
                </div>
            </div>
            <div class="pdf-navigation">
                <button class="pdf-nav-btn" id="page-prev" disabled>Previous</button>
                <span class="page-info" id="page-info">No PDF loaded</span>
                <button class="pdf-nav-btn" id="page-next" disabled>Next</button>
            </div>
        </div>

        <div class="config-panel" id="config-panel">
            <div class="empty-config">Upload a PDF and add fields to configure them.</div>
        </div>

    </div>

    <div class="validation-bar" id="validation-bar">
        <div class="validation-status" id="validation-status">
            <div class="validation-dot"></div>
            Loading...
        </div>
    </div>

</div>

<script src="/static/js/pdf-viewer.js"></script>
<script src="/static/js/app.js"></script>

</body>
</html>
